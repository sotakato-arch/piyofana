name: piyofana

# Nothing here publishes a host port. Postgres is reachable only on the
# piyofana network; Grafana Cloud reaches it later through the PDC agent.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: piyolog
      POSTGRES_USER: piyolog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "piyolog", "-d", "piyolog"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [piyofana]
    restart: unless-stopped

  collector:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: postgresql://piyolog:${POSTGRES_PASSWORD}@postgres/piyolog
      RAW_DIR: /data/raw
    volumes:
      - ./data/raw:/data/raw
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [piyofana]
    restart: unless-stopped

  # Dials out to Grafana Cloud over SSH; nothing inbound. Restricted so the
  # tunnel can open exactly one destination: this stack's Postgres. Enabled
  # by COMPOSE_PROFILES=pdc in .env once the GCLOUD_PDC_* values are set.
  pdc-agent:
    image: grafana/pdc-agent:latest
    profiles: [pdc]
    command:
      - -token=${GCLOUD_PDC_SIGNING_TOKEN:-}
      - -cluster=${GCLOUD_PDC_CLUSTER:-}
      - -gcloud-hosted-grafana-id=${GCLOUD_HOSTED_GRAFANA_ID:-}
      - -ssh-flag=-oPermitRemoteOpen=postgres:5432
    networks: [piyofana]
    restart: unless-stopped

networks:
  piyofana:
    name: piyofana
